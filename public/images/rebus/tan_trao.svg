<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2D3A31" flood-opacity="0.06" />
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070" />
      <stop offset="100%" stop-color="#D49B24" />
    </linearGradient>
    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D98A75" />
      <stop offset="100%" stop-color="#C27B66" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3B29B" />
      <stop offset="100%" stop-color="#8C9A84" />
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6CA0DC" />
      <stop offset="100%" stop-color="#2B5F8C" />
    </linearGradient>
  </defs>
  <rect width="640" height="280" rx="24" fill="#F2F0EB" />
  <rect x="8" y="8" width="624" height="264" rx="18" fill="none" stroke="#E6E2DA" stroke-width="2" />
  
    <g transform="translate(40, 40)">
    <rect width="150" height="200" rx="16" fill="#F9F8F4" stroke="#E6E2DA" stroke-width="1.5" filter="url(#shadow)" />
    
      <!-- Crescent Moon (Tân) -->
      <g transform="translate(75, 100)">
        <path d="M-15 -35 A40 40 0 1 0 25 35 A30 30 0 1 1 -15 -35 Z" fill="url(#goldGrad)" />
      </g>
    
  </g>
    <g transform="translate(210, 126)">
    <circle cx="14" cy="14" r="14" fill="#E6E2DA" />
    <path d="M14 7v14M7 14h14" stroke="#8C9A84" stroke-width="3" stroke-linecap="round" />
  </g>
    <g transform="translate(250, 40)">
    <rect width="140" height="200" rx="16" fill="#F9F8F4" stroke="#E6E2DA" stroke-width="1.5" filter="url(#shadow)" />
    
      <!-- Ancient Banyan Tree -->
      <g transform="translate(70, 70)">
        <!-- Tree Canopy -->
        <circle cx="0" cy="0" r="38" fill="#8C9A84" />
        <circle cx="-20" cy="10" r="26" fill="#6E7B68" />
        <circle cx="20" cy="10" r="26" fill="#6E7B68" />
        <!-- Trunk -->
        <rect x="-8" y="20" width="16" height="55" fill="#5A4638" rx="3" />
        <path d="M-8 40 L-22 65 M8 40 L22 65" stroke="#5A4638" stroke-width="4" stroke-linecap="round" />
      </g>
    
  </g>
    <g transform="translate(410, 126)">
    <circle cx="14" cy="14" r="14" fill="#E6E2DA" />
    <path d="M14 7v14M7 14h14" stroke="#8C9A84" stroke-width="3" stroke-linecap="round" />
  </g>
    <g transform="translate(450, 40)">
    <rect width="150" height="200" rx="16" fill="#F9F8F4" stroke="#E6E2DA" stroke-width="1.5" filter="url(#shadow)" />
    
      <!-- Ocean Wave / Trào -->
      <g transform="translate(40, 70)">
        <path d="M0 60 C20 20, 50 15, 65 35 C55 35, 45 45, 50 55 C25 50, 15 58, 0 60" fill="url(#oceanGrad)" />
        <path d="M0 80 C25 50, 55 45, 70 65 C60 65, 50 75, 55 85 C30 80, 20 88, 0 90" fill="#6CA0DC" />
      </g>
    
  </g>
  
</svg>