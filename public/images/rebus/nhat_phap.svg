<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2D3A31" flood-opacity="0.06" />
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070" />
      <stop offset="100%" stop-color="#D49B24" />
    </linearGradient>
    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D98A75" />
      <stop offset="100%" stop-color="#C27B66" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3B29B" />
      <stop offset="100%" stop-color="#8C9A84" />
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6CA0DC" />
      <stop offset="100%" stop-color="#2B5F8C" />
    </linearGradient>
  </defs>
  <rect width="640" height="280" rx="24" fill="#F2F0EB" />
  <rect x="8" y="8" width="624" height="264" rx="18" fill="none" stroke="#E6E2DA" stroke-width="2" />
  
    <g transform="translate(45, 40)">
    <rect width="155" height="200" rx="16" fill="#F9F8F4" stroke="#E6E2DA" stroke-width="1.5" filter="url(#shadow)" />
    
      <!-- Japan Flag -->
      <rect x="20" y="55" width="115" height="80" rx="8" fill="#F9F8F4" stroke="#E6E2DA" stroke-width="2" />
      <circle cx="77" cy="95" r="26" fill="#BC002D" />
    
  </g>
    <g transform="translate(220, 126)">
    <circle cx="14" cy="14" r="14" fill="#E6E2DA" />
    <path d="M14 7v14M7 14h14" stroke="#8C9A84" stroke-width="3" stroke-linecap="round" />
  </g>
    <g transform="translate(260, 40)">
    <rect width="120" height="200" rx="16" fill="#F9F8F4" stroke="#E6E2DA" stroke-width="1.5" filter="url(#shadow)" />
    
      <!-- Crossed Swords & Gunfire Explosion -->
      <g transform="translate(60, 95)">
        <line x1="-30" y1="-30" x2="30" y2="30" stroke="#8C9A84" stroke-width="6" stroke-linecap="round" />
        <line x1="30" y1="-30" x2="-30" y2="30" stroke="#8C9A84" stroke-width="6" stroke-linecap="round" />
        <!-- Sparks -->
        <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#DA251D" />
        <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#FFFF00" />
      </g>
    
  </g>
    <g transform="translate(400, 126)">
    <circle cx="14" cy="14" r="14" fill="#E6E2DA" />
    <path d="M14 7v14M7 14h14" stroke="#8C9A84" stroke-width="3" stroke-linecap="round" />
  </g>
    <g transform="translate(440, 40)">
    <rect width="155" height="200" rx="16" fill="#F9F8F4" stroke="#E6E2DA" stroke-width="1.5" filter="url(#shadow)" />
    
      <!-- France Flag -->
      <g transform="translate(20, 55)">
        <rect x="0" y="0" width="38" height="80" rx="6" fill="#002395" />
        <rect x="38" y="0" width="39" height="80" fill="#FFFFFF" />
        <rect x="77" y="0" width="38" height="80" rx="6" fill="#ED2939" />
        <rect x="0" y="0" width="115" height="80" rx="8" fill="none" stroke="#E6E2DA" stroke-width="2" />
      </g>
    
  </g>
  
</svg>