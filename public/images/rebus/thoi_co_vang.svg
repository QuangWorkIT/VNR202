<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2D3A31" flood-opacity="0.06" />
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070" />
      <stop offset="100%" stop-color="#D49B24" />
    </linearGradient>
    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D98A75" />
      <stop offset="100%" stop-color="#C27B66" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3B29B" />
      <stop offset="100%" stop-color="#8C9A84" />
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6CA0DC" />
      <stop offset="100%" stop-color="#2B5F8C" />
    </linearGradient>
  </defs>
  <rect width="640" height="280" rx="24" fill="#F2F0EB" />
  <rect x="8" y="8" width="624" height="264" rx="18" fill="none" stroke="#E6E2DA" stroke-width="2" />
  
    <g transform="translate(35, 40)">
    <rect width="150" height="200" rx="16" fill="#F9F8F4" stroke="#E6E2DA" stroke-width="1.5" filter="url(#shadow)" />
    
      <!-- Clock / Thời gian -->
      <g transform="translate(75, 100)">
        <circle cx="0" cy="0" r="45" fill="#F9F8F4" stroke="#8C9A84" stroke-width="6" />
        <circle cx="0" cy="0" r="4" fill="#2D3A31" />
        <line x1="0" y1="0" x2="0" y2="-26" stroke="#2D3A31" stroke-width="4" stroke-linecap="round" />
        <line x1="0" y1="0" x2="18" y2="0" stroke="#C27B66" stroke-width="3" stroke-linecap="round" />
      </g>
    
  </g>
    <g transform="translate(205, 126)">
    <circle cx="14" cy="14" r="14" fill="#E6E2DA" />
    <path d="M14 7v14M7 14h14" stroke="#8C9A84" stroke-width="3" stroke-linecap="round" />
  </g>
    <g transform="translate(245, 40)">
    <rect width="150" height="200" rx="16" fill="#F9F8F4" stroke="#E6E2DA" stroke-width="1.5" filter="url(#shadow)" />
    
      <!-- Chess Knight / Cờ -->
      <g transform="translate(75, 60)">
        <path d="M-18 65 C-18 45, -25 35, -20 15 C-15 0, 5 -10, 18 5 C22 15, 20 35, 20 65 Z" fill="#2D3A31" />
        <rect x="-25" y="65" width="50" height="15" rx="4" fill="#8C9A84" />
        <circle cx="0" cy="15" r="3" fill="#F9F8F4" />
      </g>
    
  </g>
    <g transform="translate(415, 126)">
    <circle cx="14" cy="14" r="14" fill="#E6E2DA" />
    <path d="M14 7v14M7 14h14" stroke="#8C9A84" stroke-width="3" stroke-linecap="round" />
  </g>
    <g transform="translate(455, 40)">
    <rect width="150" height="200" rx="16" fill="#F9F8F4" stroke="#E6E2DA" stroke-width="1.5" filter="url(#shadow)" />
    
      <!-- Gold Ingot / Vàng -->
      <g transform="translate(40, 75)">
        <polygon points="15,10 55,10 65,35 5,35" fill="url(#goldGrad)" stroke="#D49B24" stroke-width="2" />
        <polygon points="5,35 65,35 55,60 15,60" fill="#D49B24" />
        <!-- Sparkle -->
        <path d="M55 0 L58 8 L66 11 L58 14 L55 22 L52 14 L44 11 L52 8 Z" fill="#DA251D" />
      </g>
    
  </g>
  
</svg>