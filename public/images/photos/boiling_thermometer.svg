<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3e0" />
      <stop offset="60%" stop-color="#ffe0b2" />
      <stop offset="100%" stop-color="#ffcc80" />
    </radialGradient>

    <!-- Heat Radial Glow behind bulb -->
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ff9100" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#ffea00" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0" />
    </radialGradient>

    <!-- Liquid Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b71c1c" />
      <stop offset="40%" stop-color="#d50000" />
      <stop offset="80%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#ff5252" />
    </linearGradient>

    <!-- Glass Highlights -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3d00" />
      <stop offset="50%" stop-color="#ff9100" />
      <stop offset="100%" stop-color="#ffea00" />
    </linearGradient>

    <!-- Filter for heat blur/glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="30" fill="url(#bgGlow)" />

  <!-- Heat Wave / Fire Glow surrounding bottom & top -->
  <circle cx="250" cy="380" r="110" fill="url(#fireGlow)" />
  <circle cx="250" cy="110" r="85" fill="url(#fireGlow)" />

  <!-- Cartoon Flames at bottom -->
  <path d="M 190 410 Q 210 340 230 370 Q 250 310 270 360 Q 290 330 310 410 Q 250 430 190 410 Z" fill="url(#flameGrad)" opacity="0.85" filter="url(#glow)"/>
  <path d="M 210 410 Q 235 360 250 380 Q 265 350 290 410 Z" fill="#ffea00" opacity="0.9"/>

  <!-- Thermometer Glass Outer Body -->
  <!-- Stem -->
  <rect x="220" y="80" width="60" height="280" rx="30" fill="#f8fafc" stroke="#64748b" stroke-width="6" />
  <!-- Bulb -->
  <circle cx="250" cy="380" r="58" fill="#f8fafc" stroke="#64748b" stroke-width="6" />

  <!-- Boiling Liquid Inside Bulb -->
  <circle cx="250" cy="380" r="48" fill="url(#liquidGrad)" />
  <!-- Boiling Liquid Inside Stem (Filled completely to top & overflowing!) -->
  <rect x="230" y="70" width="40" height="270" rx="20" fill="url(#liquidGrad)" />

  <!-- Boiling Bubbles inside Bulb and Stem -->
  <circle cx="238" cy="370" r="10" fill="#ff8a80" opacity="0.8" />
  <circle cx="262" cy="390" r="8" fill="#ffd180" opacity="0.9" />
  <circle cx="250" cy="350" r="12" fill="#ffab91" opacity="0.85" />
  <circle cx="245" cy="290" r="7" fill="#ffe082" opacity="0.8" />
  <circle cx="255" cy="220" r="9" fill="#ff8a80" opacity="0.9" />
  <circle cx="242" cy="160" r="8" fill="#ffe082" opacity="0.85" />
  <circle cx="254" cy="100" r="11" fill="#fff" opacity="0.9" />

  <!-- Steam / Bursting Mercury at Top (QUÁ ĐỘ / BOILING OVER) -->
  <!-- Bursting liquid top -->
  <path d="M 215 75 Q 250 30 285 75 Q 300 45 280 25 Q 250 10 220 25 Q 200 45 215 75 Z" fill="url(#liquidGrad)" stroke="#d50000" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Flying hot droplets -->
  <circle cx="205" cy="35" r="9" fill="#ff1744" />
  <circle cx="295" cy="30" r="8" fill="#ff1744" />
  <circle cx="250" cy="12" r="10" fill="#ff5252" />
  <circle cx="180" cy="55" r="6" fill="#ff5252" />
  <circle cx="320" cy="50" r="6" fill="#ff1744" />

  <!-- Steam Clouds / Smoke -->
  <path d="M 185 70 C 160 50, 160 20, 190 25 C 200 5, 235 5, 245 25 C 265 10, 305 15, 305 40 C 330 40, 340 70, 315 85" 
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85" />
  <path d="M 170 100 Q 150 70 170 40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75" />
  <path d="M 330 100 Q 350 70 330 40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75" />

  <!-- Scale markings and numbers (0, 20, 40, 60, 80, 100°C) -->
  <!-- 0°C -->
  <line x1="275" y1="310" x2="300" y2="310" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <text x="308" y="316" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#1e293b">0°</text>

  <!-- 20°C -->
  <line x1="275" y1="270" x2="295" y2="270" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <text x="304" y="275" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#1e293b">20°</text>

  <!-- 40°C -->
  <line x1="275" y1="230" x2="295" y2="230" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <text x="304" y="235" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#1e293b">40°</text>

  <!-- 60°C -->
  <line x1="275" y1="190" x2="295" y2="190" stroke="#b71c1c" stroke-width="3" stroke-linecap="round" />
  <text x="304" y="195" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#b71c1c">60°</text>

  <!-- 80°C -->
  <line x1="275" y1="150" x2="300" y2="150" stroke="#b71c1c" stroke-width="4" stroke-linecap="round" />
  <text x="308" y="156" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#b71c1c">80°</text>

  <!-- 100°C (Boiling) -->
  <line x1="275" y1="110" x2="305" y2="110" stroke="#d50000" stroke-width="5" stroke-linecap="round" />
  <text x="312" y="117" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#d50000">100°C</text>

  <!-- Left ticks -->
  <line x1="205" y1="310" x2="225" y2="310" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <line x1="210" y1="270" x2="225" y2="270" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <line x1="210" y1="230" x2="225" y2="230" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <line x1="210" y1="190" x2="225" y2="190" stroke="#b71c1c" stroke-width="3" stroke-linecap="round" />
  <line x1="205" y1="150" x2="225" y2="150" stroke="#b71c1c" stroke-width="4" stroke-linecap="round" />
  <line x1="200" y1="110" x2="225" y2="110" stroke="#d50000" stroke-width="5" stroke-linecap="round" />

  <!-- Glass Shiny Reflection -->
  <path d="M 233 100 L 233 340 A 45 45 0 0 0 220 395 A 45 45 0 0 1 230 350 L 230 100 Z" fill="#ffffff" opacity="0.6" />
  <circle cx="230" cy="365" r="12" fill="#ffffff" opacity="0.5" />

  <!-- Heat / Boiling Sparks -->
  <circle cx="120" cy="180" r="5" fill="#ff5722" />
  <circle cx="100" cy="220" r="7" fill="#ff9800" />
  <circle cx="380" cy="180" r="6" fill="#ff5722" />

  <!-- Danger / Heat Waves Curves -->
  <path d="M 90 280 Q 70 300 90 320 Q 70 340 90 360" fill="none" stroke="#ff5722" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 410 280 Q 430 300 410 320 Q 430 340 410 360" fill="none" stroke="#ff5722" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
